<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Microservice-Architektur-Editor</title>
<style>
  :root{
    --bg:#05070a;
    --grid:#10151c;
    --panel:#0c1117;
    --panel-border:#1c2530;
    --text:#dbe4ee;
    --text-dim:#7c8899;
    --accent-service:#3fa9f5;
    --accent-service-fill:#0d2436;
    --accent-frontend:#c98bf5;
    --accent-frontend-fill:#241333;
    --accent-db:#4fd67a;
    --accent-db-fill:#0d2617;
    --accent-rest:#39c5cf;
    --accent-event:#f0883e;
    --accent-ws:#e775c9;
    --accent-dbconn:#6e7a8a;
    --accent-sim:#ffd85c;
    --danger:#f0555f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--bg);
    font-family:'JetBrains Mono','Fira Code',ui-monospace,Consolas,monospace;color:var(--text);}

  #app{position:relative;width:100vw;height:100vh;}

  svg#canvas{width:100%;height:100%;display:block;background:var(--bg);cursor:default;}
  svg#canvas.panning{cursor:grabbing;}

  #bgpattern rect{fill:var(--bg);}

  /* ---------- Toolbar ---------- */
  #toolbar{
    position:absolute;top:14px;left:14px;
    display:flex;gap:8px;align-items:center;
    background:var(--panel);border:1px solid var(--panel-border);
    padding:8px;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.5);
    z-index:10;flex-wrap:wrap;max-width:min(760px,calc(100vw - 320px));
  }
  #toolbar .grp{display:flex;gap:6px;padding:0 6px;border-right:1px solid var(--panel-border);}
  #toolbar .grp:last-child{border-right:none;}
  button.tbtn{
    background:#121923;color:var(--text);border:1px solid var(--panel-border);
    padding:7px 11px;border-radius:7px;font:inherit;font-size:12.5px;cursor:pointer;
    display:flex;align-items:center;gap:6px;white-space:nowrap;transition:.12s;
  }
  button.tbtn:hover{background:#1a2430;border-color:#2a3646;}
  button.tbtn.active{background:#213146;border-color:var(--accent-service);}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none;}

  /* ---------- Sidebar ---------- */
  #sidebar{
    position:absolute;top:14px;right:14px;width:280px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:10px;padding:16px;box-shadow:0 6px 24px rgba(0,0,0,.5);
    z-index:10;display:none;max-height:calc(100vh - 28px);overflow:auto;
  }
  #sidebar.show{display:block;}
  #sidebar h3{margin:0 0 12px;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--text-dim);}
  #sidebar label{display:block;font-size:11.5px;color:var(--text-dim);margin:12px 0 5px;text-transform:uppercase;letter-spacing:.03em;}
  #sidebar input[type=text], #sidebar textarea{
    width:100%;background:#0a0f15;border:1px solid var(--panel-border);color:var(--text);
    padding:8px;border-radius:6px;font:inherit;font-size:13px;resize:vertical;
  }
  #sidebar textarea{min-height:70px;}
  #sidebar .checkline{display:flex;align-items:center;gap:8px;font-size:13px;margin-top:10px;color:var(--text);}
  #sidebar .checkline input{width:16px;height:16px;}
  #sidebar .del-btn{
    margin-top:18px;width:100%;background:#2a1216;color:var(--danger);border:1px solid #4a1c22;
    padding:9px;border-radius:7px;cursor:pointer;font:inherit;font-size:13px;
  }
  #sidebar .del-btn:hover{background:#3a151b;}
  #sidebar .typebadge{
    display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 9px;
    border-radius:20px;background:#111820;border:1px solid var(--panel-border);
  }
  #sidebar .hint{font-size:11px;color:var(--text-dim);margin-top:4px;line-height:1.5;}
  #sidebar .closebtn{position:absolute;top:10px;right:12px;background:none;border:none;color:var(--text-dim);
    font-size:16px;cursor:pointer;}
  #sidebar .closebtn:hover{color:var(--text);}

  /* ---------- Event-Simulator (Sidebar) ---------- */
  .event-card{
    background:#0a0f15;border:1px solid var(--panel-border);border-radius:8px;
    padding:10px;margin-top:10px;
  }
  .event-name-input{
    width:100%;background:#111823;border:1px solid var(--panel-border);color:var(--text);
    padding:6px 8px;border-radius:6px;font:inherit;font-size:12.5px;font-weight:600;
  }
  .event-trigger-select{
    width:100%;background:#111823;border:1px solid var(--panel-border);color:var(--text);
    padding:6px 8px;border-radius:6px;font:inherit;font-size:12px;margin-top:2px;
  }
  .event-trigger-select option{background:#111823;color:var(--text);}
  .event-newtrigger-input{
    width:100%;background:#111823;border:1px solid var(--accent-sim);color:var(--text);
    padding:6px 8px;border-radius:6px;font:inherit;font-size:12px;
  }
  .event-btnrow{display:flex;gap:8px;margin-top:10px;}
  .event-btnrow button{flex:1;justify-content:center;}
  .event-btnrow button.ev-start{color:var(--accent-sim);border-color:#4a3f1c;}
  .event-btnrow button.ev-del{color:var(--danger);flex:0 0 auto;padding-left:12px;padding-right:12px;}
  #sb-content .add-event-btn{width:100%;margin-top:10px;justify-content:center;}

  /* ---------- Kompaktes Mehrfachauswahl-Dropdown für Event-Ziele ---------- */
  .target-dropdown{position:relative;margin-top:4px;}
  .target-dropdown-btn{
    width:100%;text-align:left;background:#111823;border:1px solid var(--panel-border);color:var(--text);
    padding:7px 10px;border-radius:6px;font:inherit;font-size:12px;cursor:pointer;
    display:flex;align-items:center;justify-content:space-between;gap:6px;
  }
  .target-dropdown-btn:hover{border-color:var(--accent-sim);}
  .target-dropdown-btn::after{content:"▾";color:var(--text-dim);font-size:10px;}
  .target-dropdown-panel{
    position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:40;
    background:#0d131c;border:1px solid var(--panel-border);border-radius:8px;
    box-shadow:0 8px 24px rgba(0,0,0,.5);padding:4px;max-height:220px;overflow-y:auto;
  }
  .target-dd-row{
    display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:5px;
    font-size:12px;color:var(--text);cursor:pointer;
  }
  .target-dd-row:hover{background:#1a2432;}
  .target-dd-row input{width:14px;height:14px;flex:none;}

  /* ---------- Legend ---------- */
  #legend{
    position:absolute;bottom:14px;left:14px;background:var(--panel);border:1px solid var(--panel-border);
    border-radius:10px;padding:10px 14px;font-size:11.5px;color:var(--text-dim);z-index:10;
    display:flex;flex-direction:column;gap:5px;box-shadow:0 6px 24px rgba(0,0,0,.5);
  }
  #legend .row{display:flex;align-items:center;gap:8px;}
  #legend .swatch{width:20px;height:3px;border-radius:2px;}
  #legend .swatch.dashed{background:repeating-linear-gradient(90deg,currentColor 0 5px,transparent 5px 9px);}

  /* ---------- Node hint / handle tooltip ---------- */
  #zoomlabel{
    position:absolute;bottom:14px;right:14px;background:var(--panel);border:1px solid var(--panel-border);
    border-radius:8px;padding:6px 10px;font-size:11.5px;color:var(--text-dim);z-index:10;
  }

  /* ---------- SVG node styling ---------- */
  .node-shape{cursor:grab;}
  .node-shape.dragging{cursor:grabbing;}
  .node-rect{stroke-width:1.6;rx:9;}
  .node-selected{stroke-width:3 !important;filter:drop-shadow(0 0 6px currentColor);}
  .node-label{font-size:13px;font-weight:600;fill:var(--text);pointer-events:none;user-select:none;}
  .node-sublabel{font-size:9.5px;fill:var(--text-dim);pointer-events:none;user-select:none;letter-spacing:.04em;}
  .rest-badge-bg{fill:#0f1720;stroke-width:1.2;}
  .rest-badge-text{font-size:8.5px;font-weight:700;pointer-events:none;user-select:none;}

  .handle{cursor:crosshair;}
  .handle-circle{transition:filter .12s, transform .12s;transform-box:fill-box;transform-origin:center;}
  .handle:hover .handle-circle{transform:scale(1.35);filter:drop-shadow(0 0 3px currentColor) drop-shadow(0 0 7px currentColor);}
  .handle-label{font-size:8px;font-weight:700;pointer-events:none;user-select:none;fill:#05070a;}

  .conn-path{fill:none;cursor:pointer;}
  .conn-hit{fill:none;stroke:transparent;stroke-width:16;cursor:pointer;}
  .conn-selected{filter:drop-shadow(0 0 5px currentColor);}
  .conn-label-bg{fill:#05070aee;stroke:var(--panel-border);stroke-width:1;}
  .conn-label-text{font-size:10.5px;fill:var(--text);pointer-events:none;user-select:none;}

  .envelope{font-size:13px;pointer-events:none;user-select:none;fill:#ffd85c;filter:drop-shadow(0 0 2px #000);}

  .temp-conn{pointer-events:none;stroke-dasharray:6 4;opacity:.85;}

  /* ---------- Simulation: fliegendes Event-Label ---------- */
  .sim-event{pointer-events:none;}
  .sim-event-bg{fill:#241b06;stroke:var(--accent-sim);stroke-width:1.4;filter:drop-shadow(0 0 5px rgba(255,216,92,.55));}
  .sim-event-text{font-size:10.5px;font-weight:700;fill:var(--accent-sim);pointer-events:none;user-select:none;}

  #btn-sim-stop{color:var(--danger);border-color:#4a1c22;}
  #btn-sim-stop:hover{background:#2a1216;}

  /* ---------- Hover-Glühen für Ziel-Vorschau im Event-Dropdown ---------- */
  .node-glow .node-rect{filter:drop-shadow(0 0 6px var(--accent-sim)) drop-shadow(0 0 16px var(--accent-sim));}
  .node-glow .node-label{fill:var(--accent-sim);}
  .conn-glow .conn-path{stroke:var(--accent-sim);filter:drop-shadow(0 0 6px var(--accent-sim));}

  /* Zyklus-Warnung über betroffenen Elementen */
  .cycle-marker{cursor:help;}
  .cycle-marker circle{fill:#2a1216;stroke:var(--danger);stroke-width:1.8;transition:filter .1s;}
  .cycle-marker text{font-size:12px;font-weight:800;fill:var(--danger);pointer-events:none;user-select:none;}
  .cycle-marker.cycle-glow circle{fill:#4a1c22;filter:drop-shadow(0 0 5px var(--danger)) drop-shadow(0 0 12px var(--danger));}

  #tooltip, #cycle-tooltip{
    position:absolute;z-index:30;pointer-events:none;
    background:#101820;border:1px solid #24313f;color:var(--text);
    padding:8px 12px;border-radius:9px;font-size:12.5px;line-height:1.45;
    max-width:240px;box-shadow:0 8px 22px rgba(0,0,0,.55);
    transform:translate(-50%,calc(-100% - 14px));opacity:0;transition:opacity .1s;
  }
  #tooltip.show, #cycle-tooltip.show{opacity:1;}
  #tooltip::after, #cycle-tooltip::after{
    content:"";position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);
    border-width:7px 7px 0 7px;border-style:solid;border-color:#101820 transparent transparent transparent;
  }

  #cycle-tooltip{max-width:340px;border-color:#4a1c22;}
  #cycle-tooltip h5{margin:0 0 6px;font-size:12.5px;color:var(--danger);}
  #cycle-tooltip h5:not(:first-child){margin-top:10px;}
  #cycle-tooltip ol{margin:0;padding-left:26px;}
  #cycle-tooltip .ev-name{color:var(--accent-sim);font-weight:600;}
  #cycle-tooltip .more{margin-top:4px;color:var(--text-dim);font-size:11.5px;}

  #confirmOverlay, #errorOverlay{
    position:absolute;inset:0;background:rgba(3,5,8,.6);z-index:40;
    display:none;align-items:center;justify-content:center;
  }
  #confirmOverlay.show, #errorOverlay.show{display:flex;}
  #confirmBox, #errorBox{
    background:var(--panel);border:1px solid var(--panel-border);border-radius:12px;
    padding:20px 22px;max-width:320px;box-shadow:0 12px 40px rgba(0,0,0,.6);
  }
  #confirmBox p, #errorBox p{margin:0 0 16px;font-size:13.5px;line-height:1.5;color:var(--text);}
  #confirmBox .btnrow, #errorBox .btnrow{display:flex;gap:10px;justify-content:flex-end;}
  #confirmBox button, #errorBox button{
    font:inherit;font-size:12.5px;padding:8px 14px;border-radius:7px;cursor:pointer;
    border:1px solid var(--panel-border);background:#121923;color:var(--text);
  }
  #confirmBox button#confirmYes{background:#2a1216;border-color:#4a1c22;color:var(--danger);}
  #confirmBox button:hover, #errorBox button:hover{filter:brightness(1.2);}
  #errorBox{max-width:440px;}
  #confirmDetails{max-height:260px;overflow:auto;margin:-6px 0 0;}
  #confirmDetails ul{margin:0 0 16px;padding-left:18px;font-size:12.5px;line-height:1.5;color:var(--text);}
  #confirmDetails p{margin:0 0 6px;}
  #errorBox h4{margin:0 0 10px;font-size:14px;color:var(--danger);}
  #errorList{margin:0 0 16px;padding-left:18px;font-size:12.5px;line-height:1.5;color:var(--text);max-height:260px;overflow:auto;}
  #hint-toast{
    position:absolute;top:14px;left:50%;transform:translateX(-50%);
    background:#132033;border:1px solid #23405c;color:#bcdcff;padding:8px 16px;
    border-radius:8px;font-size:12.5px;z-index:20;display:none;box-shadow:0 6px 20px rgba(0,0,0,.5);
  }
</style>
</head>
<body>
<div id="app">
  <svg id="canvas">
    <defs>
      <pattern id="bgpattern" width="28" height="28" patternUnits="userSpaceOnUse">
        <rect width="28" height="28"></rect>
        <circle cx="1" cy="1" r="1" fill="#151c25"></circle>
      </pattern>

      <marker id="arrow-rest" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="var(--accent-rest)"></path>
      </marker>
      <marker id="arrow-event" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="var(--accent-event)"></path>
      </marker>
      <marker id="arrow-ws" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="var(--accent-ws)"></path>
      </marker>
      <marker id="arrow-ws-rev" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
        <path d="M10,0 L0,5 L10,10 z" fill="var(--accent-ws)"></path>
      </marker>
      <marker id="arrow-db" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="var(--accent-dbconn)"></path>
      </marker>
      <marker id="arrow-temp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#7c8899"></path>
      </marker>
    </defs>

    <rect id="bgrect" x="-20000" y="-20000" width="40000" height="40000" fill="url(#bgpattern)"></rect>

    <g id="world">
      <g id="connLayer"></g>
      <g id="nodeLayer"></g>
      <g id="tempLayer"></g>
      <g id="simLayer"></g>
    </g>
  </svg>

  <div id="toolbar">
    <div class="grp">
      <button class="tbtn" id="btn-add-service"><span class="dot" style="background:var(--accent-service)"></span>+ Service</button>
      <button class="tbtn" id="btn-add-frontend"><span class="dot" style="background:var(--accent-frontend)"></span>+ Frontend</button>
      <button class="tbtn" id="btn-add-db"><span class="dot" style="background:var(--accent-db)"></span>+ Datenbank</button>
    </div>
    <div class="grp">
      <button class="tbtn" id="btn-export">⭳ Export JSON</button>
      <button class="tbtn" id="btn-import">⭱ Import JSON</button>
      <input type="file" id="file-import" accept="application/json" style="display:none;">
    </div>
    <div class="grp">
      <button class="tbtn" id="btn-reset-view">⤢ Ansicht zurücksetzen</button>
      <button class="tbtn" id="btn-clear">🗑 Alles löschen</button>
    </div>
    <div class="grp">
      <button class="tbtn" id="btn-sim-stop">⏹ Simulation stoppen</button>
    </div>
  </div>

  <div id="hint-toast"></div>
  <div id="tooltip"></div>
  <div id="cycle-tooltip"></div>

  <div id="confirmOverlay">
    <div id="confirmBox">
      <p id="confirmMsg"></p>
      <div id="confirmDetails"></div>
      <div class="btnrow">
        <button id="confirmNo">Abbrechen</button>
        <button id="confirmYes">Löschen</button>
      </div>
    </div>
  </div>

  <div id="errorOverlay">
    <div id="errorBox">
      <h4 id="errorTitle"></h4>
      <p id="errorMsg"></p>
      <ul id="errorList"></ul>
      <div class="btnrow">
        <button id="errorOk">OK</button>
      </div>
    </div>
  </div>

  <div id="sidebar">
    <button class="closebtn" id="sb-close">✕</button>
    <div id="sb-content"></div>
  </div>

  <div id="legend">
    <div class="row"><span class="dot" style="background:var(--accent-service)"></span>Service</div>
    <div class="row"><span class="dot" style="background:var(--accent-frontend)"></span>Frontend</div>
    <div class="row"><span class="dot" style="background:var(--accent-db)"></span>Datenbank</div>
    <div class="row" style="color:var(--accent-rest)"><span class="swatch" style="background:var(--accent-rest)"></span>REST-Verbindung →</div>
    <div class="row" style="color:var(--accent-ws)"><span class="swatch dashed" style="color:var(--accent-ws)"></span>WebSocket (REST-Sonderfall) ⇄</div>
    <div class="row" style="color:var(--accent-event)"><span class="swatch" style="background:var(--accent-event)"></span>Event-Verbindung →</div>
    <div class="row" style="color:var(--accent-dbconn)"><span class="swatch dashed" style="color:var(--accent-dbconn)"></span>Datenbank-Verbindung</div>
    <div class="row" style="color:var(--accent-sim)"><span class="swatch" style="background:var(--accent-sim)"></span>Simulierter Event-Fluss</div>
  </div>

  <div id="zoomlabel">Zoom: <span id="zoomval">100%</span></div>
</div>

<script>
(function(){
"use strict";

/* ============================================================
   STATE
   ============================================================ */
let state = {
  nodes: [
    {id:"n1", type:"frontend", name:"Web-Frontend", x:-260, y:-40, offersRest:false, description:"Single-Page-App im Browser der Kund:innen.",
      events:[{id:"ev1", name:"BestellungAbsenden", trigger:"__button__", targetIds:["n3"]}]},
    {id:"n2", type:"service",  name:"Auth-Service",  x:80,  y:-160, offersRest:true, description:"Verwaltet Login, Tokens und Berechtigungen.",
      events:[]},
    {id:"n3", type:"service",  name:"Order-Service", x:80,  y:60,  offersRest:true, description:"Nimmt Bestellungen entgegen und verarbeitet sie.",
      events:[{id:"ev2", name:"OrderCreated", trigger:"BestellungAbsenden", targetIds:["n2","n4"]}]},
    {id:"n4", type:"database", name:"Order-DB",       x:400, y:60,  offersRest:false, description:"PostgreSQL-Datenbank für Bestelldaten.",
      events:[{id:"ev3", name:"OrderSaved", trigger:"OrderCreated", targetIds:[]}]}
  ],
  connections: [
    {id:"c1", type:"rest", from:"n1", to:"n2", description:"Login / Token", websocket:false},
    {id:"c2", type:"rest", from:"n1", to:"n3", description:"Bestellungen abrufen", websocket:false},
    {id:"c3", type:"event", from:"n3", to:"n2", description:"OrderCreated", websocket:false},
    {id:"c4", type:"db", from:"n3", to:"n4", description:"", websocket:false}
  ]
};

let selectedNodeId = null;
let selectedConnId = null;
let idCounter = 100;

const NODE_W = {service:150, frontend:150, database:130};
const NODE_H = {service:64, frontend:64, database:74};

const TYPE_META = {
  service:  {stroke:"var(--accent-service)",  fill:"var(--accent-service-fill)",  label:"SERVICE"},
  frontend: {stroke:"var(--accent-frontend)", fill:"var(--accent-frontend-fill)", label:"FRONTEND"},
  database: {stroke:"var(--accent-db)",       fill:"var(--accent-db-fill)",       label:"DATENBANK"}
};

const CONN_NAMES = {rest:"REST", event:"Event", db:"Datenbank"};

const CONN_META = {
  rest:  {color:"var(--accent-rest)",  marker:"url(#arrow-rest)",  dash:"none",   label:"REST"},
  event: {color:"var(--accent-event)", marker:"url(#arrow-event)", dash:"none",   label:"EVENT"},
  db:    {color:"var(--accent-dbconn)",marker:"url(#arrow-db)",    dash:"5 5",    label:"DB"}
};

/* ============================================================
   VIEW (pan & zoom)
   ============================================================ */
let view = {tx: window.innerWidth/2, ty: window.innerHeight/2, scale: 1};

const svg = document.getElementById("canvas");
const world = document.getElementById("world");
const nodeLayer = document.getElementById("nodeLayer");
const connLayer = document.getElementById("connLayer");
const tempLayer = document.getElementById("tempLayer");
const simLayer = document.getElementById("simLayer");

function updateViewTransform(){
  world.setAttribute("transform", `translate(${view.tx},${view.ty}) scale(${view.scale})`);
  document.getElementById("zoomval").textContent = Math.round(view.scale*100)+"%";
}
updateViewTransform();

function screenToWorld(clientX, clientY){
  const rect = svg.getBoundingClientRect();
  const sx = clientX - rect.left;
  const sy = clientY - rect.top;
  return {x:(sx - view.tx)/view.scale, y:(sy - view.ty)/view.scale};
}
function worldToScreen(x, y){
  const rect = svg.getBoundingClientRect();
  return {x: rect.left + view.tx + x*view.scale, y: rect.top + view.ty + y*view.scale};
}

svg.addEventListener("wheel", e=>{
  e.preventDefault();
  hideTooltip();
  const rect = svg.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const wx = (mx - view.tx)/view.scale;
  const wy = (my - view.ty)/view.scale;
  const delta = -e.deltaY * 0.0016;
  let newScale = view.scale * (1+delta);
  newScale = Math.min(3, Math.max(0.15, newScale));
  view.tx = mx - wx*newScale;
  view.ty = my - wy*newScale;
  view.scale = newScale;
  updateViewTransform();
}, {passive:false});

/* background panning */
let panning = false, panStart = null, viewStart = null;
svg.addEventListener("mousedown", e=>{
  if (e.target === svg || e.target.id === "bgrect"){
    panning = true;
    panStart = {x:e.clientX, y:e.clientY};
    viewStart = {tx:view.tx, ty:view.ty};
    svg.classList.add("panning");
    hideTooltip();
    deselectAll();
  }
});
window.addEventListener("mousemove", e=>{
  if (panning){
    hideTooltip();
    view.tx = viewStart.tx + (e.clientX - panStart.x);
    view.ty = viewStart.ty + (e.clientY - panStart.y);
    updateViewTransform();
  }
});
window.addEventListener("mouseup", ()=>{
  if (panning){ panning=false; svg.classList.remove("panning"); }
});

document.getElementById("btn-reset-view").addEventListener("click", ()=>{
  view = {tx: window.innerWidth/2, ty: window.innerHeight/2, scale: 1};
  updateViewTransform();
});

/* Überspringt IDs, die bereits vergeben sind — importierte Diagramme können IDs
   enthalten, die der Zähler dieser Sitzung noch nicht kennt. */
function idInUse(id){
  return state.connections.some(c=>c.id===id) ||
    state.nodes.some(n=>n.id===id || (n.events||[]).some(e=>e.id===id));
}
function uid(prefix){
  let id;
  do { idCounter++; id = prefix + idCounter; } while (idInUse(id));
  return id;
}
function getNode(id){ return state.nodes.find(n=>n.id===id); }
function nodeSize(node){ return {w:NODE_W[node.type], h:NODE_H[node.type]}; }

function toast(msg, ms){
  const el = document.getElementById("hint-toast");
  el.textContent = msg;
  el.style.display = "block";
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>{ el.style.display="none"; }, ms||2200);
}

/* ---- Eigener Bestätigungsdialog (window.confirm wird in manchen
       eingebetteten Vorschau-Umgebungen blockiert und würde die Aktion
       sonst stillschweigend abbrechen) ---- */
const confirmOverlay = document.getElementById("confirmOverlay");
const confirmMsg = document.getElementById("confirmMsg");
const confirmYes = document.getElementById("confirmYes");
const confirmNo = document.getElementById("confirmNo");
const confirmDetails = document.getElementById("confirmDetails");
/* opts.yesLabel: Text des Bestätigungs-Buttons (Standard „Löschen“),
   opts.sections: optionale Abschnitte [{text, items:[…]}] unter der Meldung */
function showConfirm(message, onConfirm, opts){
  opts = opts || {};
  confirmMsg.textContent = message;
  confirmYes.textContent = opts.yesLabel || "Löschen";
  confirmDetails.innerHTML = "";
  (opts.sections || []).forEach(section=>{
    if (section.text){
      const p = document.createElement("p");
      p.textContent = section.text;
      confirmDetails.appendChild(p);
    }
    const ul = document.createElement("ul");
    section.items.forEach(item=>{
      const li = document.createElement("li");
      li.textContent = item;
      ul.appendChild(li);
    });
    confirmDetails.appendChild(ul);
  });
  confirmOverlay.classList.add("show");
  function cleanup(){
    confirmOverlay.classList.remove("show");
    confirmYes.removeEventListener("click", onYes);
    confirmNo.removeEventListener("click", onNo);
  }
  function onYes(){ cleanup(); onConfirm(); }
  function onNo(){ cleanup(); }
  confirmYes.addEventListener("click", onYes);
  confirmNo.addEventListener("click", onNo);
}

const errorOverlay = document.getElementById("errorOverlay");
document.getElementById("errorOk").addEventListener("click", ()=>{

function showErrors(title, message, errors){

/* edge point: intersection of the line between two node centers and node's rect border */
function edgePoint(node, towardX, towardY){
  const {w,h} = nodeSize(node);
  const cx = node.x, cy = node.y;
  const dx = towardX - cx, dy = towardY - cy;
  if (dx===0 && dy===0) return {x:cx,y:cy};
  const hw = w/2, hh = h/2;
  const scaleX = dx!==0 ? hw/Math.abs(dx) : Infinity;
  const scaleY = dy!==0 ? hh/Math.abs(dy) : Infinity;
  const s = Math.min(scaleX, scaleY);
  return {x: cx + dx*s, y: cy + dy*s};
}

function connEndpoints(conn){
  const a = getNode(conn.from), b = getNode(conn.to);
  if (!a || !b) return null;
  let p1 = edgePoint(a, b.x, b.y);
  let p2 = edgePoint(b, a.x, a.y);

  const offset = getConnOffset(conn);
  if (offset !== 0){
    // Kanonische Normale anhand einer festen Knoten-Reihenfolge (unabhängig von der
    // tatsächlichen Pfeilrichtung), damit Hin- und Rückverbindungen echt parallel bleiben.
    const [loId, hiId] = [conn.from, conn.to].sort();
    const lo = getNode(loId), hi = getNode(hiId);
    const cdx = hi.x - lo.x, cdy = hi.y - lo.y;
    const clen = Math.hypot(cdx, cdy) || 1;
    const nx = -cdy/clen, ny = cdx/clen;
    p1 = {x: p1.x + nx*offset, y: p1.y + ny*offset};
    p2 = {x: p2.x + nx*offset, y: p2.y + ny*offset};
  }
  return {p1, p2};
}

/* Verbindungen zwischen dem gleichen Elementpaar (unabhängig von Richtung/Typ)
   werden parallel versetzt, damit übereinanderliegende Pfeile alle sichtbar & anklickbar bleiben. */
function getConnGroups(){
  const groups = {};
  for (const c of state.connections){
    const key = [c.from, c.to].sort().join("|");
    (groups[key] = groups[key] || []).push(c.id);
  }
  return groups;
}
function getConnOffset(conn){
  const groups = getConnGroups();
  const key = [conn.from, conn.to].sort().join("|");
  const ids = groups[key];
  const total = ids.length;
  if (total <= 1) return 0;
  const idx = ids.indexOf(conn.id);
  const spacing = 16;
  return (idx - (total-1)/2) * spacing;
}

/* ============================================================
   RENDER
   ============================================================ */
function render(){
  currentCycles = detectCycles();
  renderConnections();
  renderNodes();
}

function svgEl(tag, attrs){
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}

function renderNodes(){
  hideCycleTooltip(); // Marker werden neu aufgebaut — ein offener Tooltip hätte sonst kein mouseleave mehr
  nodeLayer.innerHTML = "";
  for (const node of state.nodes){
    nodeLayer.appendChild(buildNodeEl(node));
  }
}

function buildNodeEl(node){
  const meta = TYPE_META[node.type];
  const {w,h} = nodeSize(node);
  const g = svgEl("g", {class:"node-shape", transform:`translate(${node.x},${node.y})`, "data-id":node.id});

  if (node.type === "database"){
    // cylinder shape
    const ellH = 14;
    const body = svgEl("path", {
      d:`M ${-w/2},${-h/2+ellH} 
         A ${w/2},${ellH} 0 0 1 ${w/2},${-h/2+ellH}
         L ${w/2},${h/2-ellH}
         A ${w/2},${ellH} 0 0 1 ${-w/2},${h/2-ellH} Z`,
      fill: "var(--accent-db-fill)", stroke: meta.stroke, class:"node-rect"
    });
    const topEll = svgEl("ellipse", {cx:0, cy:-h/2+ellH, rx:w/2, ry:ellH, fill:"#0f2a1c", stroke:meta.stroke, "stroke-width":1.6});
    g.appendChild(body);
    g.appendChild(topEll);
  } else {
    const rect = svgEl("rect", {x:-w/2, y:-h/2, width:w, height:h, fill:meta.fill, stroke:meta.stroke, class:"node-rect"});
    g.appendChild(rect);
  }

  if (node.id === selectedNodeId){
    const sel = node.type === "database"
      ? svgEl("rect", {x:-w/2-6, y:-h/2-6, width:w+12, height:h+12, rx:12, fill:"none", stroke:meta.stroke, class:"node-selected"})
      : svgEl("rect", {x:-w/2-6, y:-h/2-6, width:w+12, height:h+12, rx:14, fill:"none", stroke:meta.stroke, class:"node-selected"});
    g.appendChild(sel);
  }

  const label = svgEl("text", {x:0, y:2, class:"node-label", "text-anchor":"middle"});
  label.textContent = node.name;
  g.appendChild(label);

  const sub = svgEl("text", {x:0, y:h/2 - 8, class:"node-sublabel", "text-anchor":"middle"});
  sub.textContent = meta.label;
  g.appendChild(sub);

  // REST badge (nur Services können eine REST-Schnittstelle anbieten)
  if (node.type === "service" && node.offersRest){
    const bx = w/2 - 22, by = -h/2 + 2;
    const badgeBg = svgEl("rect", {x:bx, y:by, width:34, height:16, rx:8, class:"rest-badge-bg", stroke:"var(--accent-rest)"});
    const badgeText = svgEl("text", {x:bx+17, y:by+11.5, class:"rest-badge-text", "text-anchor":"middle", fill:"var(--accent-rest)"});
    badgeText.textContent = "REST";
    g.appendChild(badgeBg);
    g.appendChild(badgeText);
  }

  // Connection handles: R (REST) für Service & Frontend, E (Event) nur für Service.
  // Datenbanken können keine Verbindung initiieren, Frontends keine Event-Verbindung.
  if (node.type === "service" || node.type === "frontend"){
    g.appendChild(buildHandle(node, w, h, "rest", -1, "var(--accent-rest)", "R"));
  }
  if (node.type === "service"){
    g.appendChild(buildHandle(node, w, h, "event", 1, "var(--accent-event)", "E"));
  }

  if (currentCycles.some(c=>c.nodeIds.has(node.id))){
    g.appendChild(buildCycleMarker(node, h));
  }

  // interactions
  g.addEventListener("mousedown", e=>{
    if (e.target.classList.contains("handle")) return;
    e.stopPropagation();
    hideTooltip();
    startNodeDrag(node, e);
  });
  g.addEventListener("mouseenter", ()=>{
    if (dragCtx || connCtx || panning) return;
    showTooltip(node);
  });
  g.addEventListener("mouseleave", hideTooltip);

  return g;
}

function buildHandle(node, w, h, connType, side, color, letter){
  const hx = w/2 + 14;
  const hy = side * (h/2 - 8);
  const grp = svgEl("g", {class:"handle", style:`color:${color}`, "data-node":node.id, "data-conntype":connType, transform:`translate(${hx},${hy})`});
  const circ = svgEl("circle", {class:"handle-circle", r:9, fill:color, stroke:"#05070a", "stroke-width":1.5});
  const txt = svgEl("text", {class:"handle-label", "text-anchor":"middle", y:3});
  txt.textContent = letter;
  grp.appendChild(circ);
  grp.appendChild(txt);
  grp.addEventListener("mousedown", e=>{
    e.stopPropagation();
    hideTooltip();
    startConnectionDrag(node, connType, e);
  });
  return grp;
}

function renderConnections(){
  connLayer.innerHTML = "";
  for (const conn of state.connections){
    const el = buildConnectionEl(conn);
    if (el) connLayer.appendChild(el);
  }
}

function buildConnectionEl(conn){
  const ep = connEndpoints(conn);
  if (!ep) return null;
  const {p1,p2} = ep;
  const meta = CONN_META[conn.type];
  const isWs = conn.type === "rest" && conn.websocket;

  const g = svgEl("g", {class:"conn", "data-id":conn.id});

  const pathId = "path_"+conn.id;
  const d = `M ${p1.x},${p1.y} L ${p2.x},${p2.y}`;

  const path = svgEl("path", {
    id:pathId, d,
    stroke: isWs ? "var(--accent-ws)" : meta.color,
    "stroke-width": conn.id===selectedConnId ? 3 : 2,
    "stroke-dasharray": isWs ? "7 5" : meta.dash,
    class: "conn-path" + (conn.id===selectedConnId ? " conn-selected" : ""),
    "marker-end": isWs ? "url(#arrow-ws)" : meta.marker
  });
  if (isWs) path.setAttribute("marker-start", "url(#arrow-ws-rev)");
  if (conn.id===selectedConnId){
    path.style.setProperty("color", isWs ? "var(--accent-ws)" : meta.color);
  }
  g.appendChild(path);

  const hit = svgEl("path", {d, class:"conn-hit"});
  hit.addEventListener("mousedown", e=>{ e.stopPropagation(); });
  hit.addEventListener("click", e=>{ e.stopPropagation(); selectConnection(conn.id); });
  g.appendChild(hit);

  // Brief-Animation nur bei Event-Verbindungen
  if (conn.type === "event"){
    g.appendChild(buildEnvelope(pathId, "0;1", 2.6));
  }

  // description label
  if (conn.description){
    const mx = (p1.x+p2.x)/2, my=(p1.y+p2.y)/2;
    const textWidth = Math.min(220, Math.max(40, conn.description.length*6.2));
    const bg = svgEl("rect", {x:mx-textWidth/2, y:my-10, width:textWidth, height:20, rx:5, class:"conn-label-bg"});
    const txt = svgEl("text", {x:mx, y:my+4, class:"conn-label-text", "text-anchor":"middle"});
    txt.textContent = conn.description.length>34 ? conn.description.slice(0,33)+"…" : conn.description;
    g.appendChild(bg);
    g.appendChild(txt);
  }

  return g;
}

function buildEnvelope(pathId, keyTimes, dur){
  const txt = svgEl("text", {class:"envelope", "text-anchor":"middle"});
  txt.textContent = "✉";
  const animMotion = svgEl("animateMotion", {
    dur: dur+"s", repeatCount:"indefinite", rotate:"0",
    keyPoints: keyTimes, keyTimes:"0;1", calcMode:"linear"
  });
  const mpath = svgEl("mpath", {});
  mpath.setAttributeNS("http://www.w3.org/1999/xlink", "href", "#"+pathId);
  animMotion.appendChild(mpath);
  txt.appendChild(animMotion);
  return txt;
}

/* ============================================================
   NODE DRAG (move) vs CLICK (select)
   ============================================================ */
let dragCtx = null;

function startNodeDrag(node, e){
  const startWorld = screenToWorld(e.clientX, e.clientY);
  dragCtx = {
    node, moved:false,
    offX: startWorld.x - node.x,
    offY: startWorld.y - node.y
  };
  // Ziehen erst ab einer Gesamtstrecke in Bildschirmpixeln seit dem Klick — unabhängig von
  // Zoom und Mausgeschwindigkeit. Kleineres Zittern zählt als Klick und verschiebt nichts.
  const DRAG_THRESHOLD_PX = 3;
  function onMove(ev){
    if (!dragCtx.moved){
      if (Math.hypot(ev.clientX - e.clientX, ev.clientY - e.clientY) <= DRAG_THRESHOLD_PX) return;
      dragCtx.moved = true;
    }
    const w = screenToWorld(ev.clientX, ev.clientY);
    node.x = w.x - dragCtx.offX; node.y = w.y - dragCtx.offY;
    render();
  }
  function onUp(ev){
    window.removeEventListener("mousemove", onMove);
    window.removeEventListener("mouseup", onUp);
    if (!dragCtx.moved){
      selectNode(node.id);
    } else {
      render();
    }
    dragCtx = null;
  }
  window.addEventListener("mousemove", onMove);
  window.addEventListener("mouseup", onUp);
}

/* ============================================================
   CONNECTION DRAG (create)
   ============================================================ */
let connCtx = null;

function startConnectionDrag(sourceNode, connType, e){
  const startPos = {x:sourceNode.x, y:sourceNode.y};
  connCtx = {sourceNode, connType};
  const color = connType==="rest" ? "var(--accent-rest)" : "var(--accent-event)";
  const tempPath = svgEl("path", {class:"temp-conn", stroke:color, "stroke-width":2.5, "marker-end":"url(#arrow-temp)", fill:"none"});
  tempLayer.appendChild(tempPath);

  toast(connType==="rest" ? "REST-Verbindung ziehen und auf Ziel-Service loslassen …" : "Event-Verbindung ziehen und auf Ziel-Service loslassen …", 4000);

  function onMove(ev){
    const w = screenToWorld(ev.clientX, ev.clientY);
    tempPath.setAttribute("d", `M ${startPos.x},${startPos.y} L ${w.x},${w.y}`);
  }
  function onUp(ev){
    window.removeEventListener("mousemove", onMove);
    window.removeEventListener("mouseup", onUp);
    tempLayer.innerHTML = "";
    document.getElementById("hint-toast").style.display="none";

    const w = screenToWorld(ev.clientX, ev.clientY);
    const target = findNodeAt(w.x, w.y);
    if (target && target.id !== sourceNode.id){
      createConnection(sourceNode, target, connType);
    }
    connCtx = null;
  }
  window.addEventListener("mousemove", onMove);
  window.addEventListener("mouseup", onUp);
}

function findNodeAt(x,y){
  for (let i=state.nodes.length-1;i>=0;i--){
    const n = state.nodes[i];
    const {w,h} = nodeSize(n);
    if (x >= n.x-w/2 && x <= n.x+w/2 && y >= n.y-h/2 && y <= n.y+h/2) return n;
  }
  return null;
}

/* Verbindungsregeln — gelten beim Ziehen neuer Verbindungen und beim Import.
   Liefert eine Fehlermeldung oder null, wenn die Verbindung erlaubt ist. */
function connectionRuleError(source, target, type){
  if (source.type === "database") return "Datenbanken können keine Verbindung aufbauen.";
  if (type === "rest"){
    if (target.type === "frontend") return "REST-Verbindungen zu einem Frontend sind nicht möglich — ein Frontend bietet keine REST-Schnittstelle an.";
    if (target.type === "database") return "Verbindungen zu einer Datenbank müssen vom Typ „db“ sein.";
    if (!target.offersRest) return "„" + target.name + "“ bietet keine REST-Schnittstelle an. Sie lässt sich in der Seitenleiste des Service aktivieren.";
  }
  if (type === "event"){
    if (source.type === "frontend" || target.type === "frontend") return "Event-Verbindungen mit einem Frontend sind nicht vorgesehen.";
    if (target.type === "database") return "Event-Verbindungen zu Datenbanken sind nicht vorgesehen.";
  }
  if (type === "db" && target.type !== "database") return "Datenbank-Verbindungen müssen zu einer Datenbank führen.";
  return null;
}

/* Hat der Service eingehende REST-Verbindungen (inkl. WebSocket)? Dann muss er
   seine REST-Schnittstelle behalten. */
function hasIncomingRest(node){
  return state.connections.some(c=>c.to === node.id && c.type === "rest");
}

function createConnection(source, target, connType){
  // REST-Handle auf eine Datenbank gezogen => DB-Verbindung
  const type = connType === "rest" && target.type === "database" ? "db" : connType;
  const error = connectionRuleError(source, target, type);
  if (error){
    toast(error, 4000);
    return;
  }
  if (state.connections.some(c=>c.type===type && c.from===source.id && c.to===target.id)){
    toast("Zwischen „" + source.name + "“ und „" + target.name + "“ gibt es bereits eine " + CONN_NAMES[type] + "-Verbindung in diese Richtung.", 4000);
    return;
  }
  const conn = {id:uid("c"), type, from:source.id, to:target.id, description:"", websocket:false};
  state.connections.push(conn);
  render();
  selectConnection(conn.id);
}

/* ============================================================
   SELECTION / SIDEBAR
   ============================================================ */
function deselectAll(){
  selectedNodeId = null; selectedConnId = null;
  hideTooltip();
  document.getElementById("sidebar").classList.remove("show");
  render();
}
document.getElementById("sb-close").addEventListener("click", deselectAll);

function selectNode(id){
  selectedConnId = null;
  selectedNodeId = id;
  render();
  showNodeSidebar(getNode(id));
}

function selectConnection(id){

  selectedConnId = id;
  render();

}

function showNodeSidebar(node){
  closeOpenTargetDropdown();

  sb.classList.add("show");

  const h = document.createElement("h3"); h.textContent = "Element bearbeiten"; content.appendChild(h);

  badge.className = "typebadge";
  badge.style.color = meta.stroke;

  const lblName = document.createElement("label"); lblName.textContent = "Name"; content.appendChild(lblName);
  const inpName = document.createElement("input"); inpName.type="text"; inpName.value = node.name;
  inpName.addEventListener("input", ()=>{ node.name = inpName.value; render(); });
  content.appendChild(inpName);

  const lblDesc = document.createElement("label"); lblDesc.textContent = "Beschreibung (Sprechblase beim Hover)"; content.appendChild(lblDesc);
  const taDesc = document.createElement("textarea"); taDesc.value = node.description || "";
  taDesc.placeholder = "Wird beim Überfahren des Elements mit der Maus angezeigt …";

  content.appendChild(taDesc);

  if (node.type === "service"){
    const line = document.createElement("div"); line.className="checkline";

    const restLocked = !!node.offersRest && hasIncomingRest(node);
    cb.disabled = restLocked;
    cb.addEventListener("change", ()=>{ node.offersRest = cb.checked; render(); });
    const lb = document.createElement("label"); lb.setAttribute("for","cb-rest"); lb.style.margin="0"; lb.style.textTransform="none";
    lb.textContent = "Bietet REST-Schnittstelle an";
    line.appendChild(cb); line.appendChild(lb);
    content.appendChild(line);
    const hint = document.createElement("div"); hint.className="hint";
    hint.textContent = restLocked
      ? "Wird als REST-Badge am Element angezeigt. Lässt sich erst abschalten, wenn keine REST-Verbindungen zu diesem Service mehr bestehen."
      : "Wird als REST-Badge am Element angezeigt. Nur Services mit REST-Schnittstelle können REST-Verbindungen annehmen.";
    content.appendChild(hint);
  } else if (node.type === "frontend"){
    const hint = document.createElement("div"); hint.className="hint";
    hint.style.marginTop="10px";
    hint.textContent = "Ein Frontend bietet selbst keine REST-Schnittstelle an und kann keine Event-Verbindung haben — es kann aber REST-Verbindungen zu Services mit REST-Schnittstelle aufbauen.";
    content.appendChild(hint);
  }

  const hint2 = document.createElement("div"); hint2.className="hint";
  hint2.style.marginTop="14px";
  hint2.textContent = "Ziehen an den kleinen Punkten (R = REST, E = Event) erstellt eine Verbindung zu einem anderen Element. Element im Body verschieben durch Klicken & Ziehen.";
  content.appendChild(hint2);

/* Events, die durch das Entfernen von Verbindungen (und ggf. eines Elements) ein Ziel
   verlieren. Ein Ziel geht verloren, wenn es das entfernte Element ist oder nur über eine
   der entfernten Verbindungen erreichbar war — gibt es noch einen anderen Weg (z. B. den
   Antwortweg einer REST-Anfrage), bleibt es erhalten. Hat ein betroffenes Event danach noch
   ein anderes erreichbares Ziel, verliert es nur die unerreichbaren Ziele ("modified");
   sonst wird es gelöscht ("deleted"). Datenbank-Events haben kein festes Ziel und sind
   daher nie betroffen. */
function eventsLosingTargets(remainingConnections, removedNodeId){
  const deleted = [], modified = [];
  state.nodes.forEach(node=>{
    if (node.type === "database" || node.id === removedNodeId) return;
    (node.events||[]).forEach(ev=>{
      const targetIds = ev.targetIds || [];
      const lostIds = targetIds.filter(targetId=>
        targetId === removedNodeId ||
        (findConnectionForTravel(node.id, targetId) && !findConnectionForTravel(node.id, targetId, remainingConnections)));
      if (!lostIds.length) return;
      const keepsTarget = targetIds.some(targetId=>
        !lostIds.includes(targetId) && getNode(targetId) && findConnectionForTravel(node.id, targetId, remainingConnections));
      (keepsTarget ? modified : deleted).push({node, ev, lostIds});
    });
  });
  return {deleted, modified};
}

function applyEventLosses({deleted, modified}){
  deleted.forEach(({node, ev})=>{
    node.events = node.events.filter(e=>e.id!==ev.id);
  });
  modified.forEach(({ev, lostIds})=>{
    ev.targetIds = ev.targetIds.filter(id=>!lostIds.includes(id));
  });
}

/* Führt doDelete direkt aus, wenn keine Events betroffen sind — sonst erst nach Rückfrage.
   subject: z. B. "Diese Verbindung" / "Dieses Element", what: "der Verbindung" / "des Elements" */
function confirmEventLosses(losses, subject, what, doDelete){
  const {deleted, modified} = losses;
  if (!deleted.length && !modified.length){ doDelete(); return; }

  const evLabel = ({node, ev}) => node.name + ": " + (ev.name || "(Event)");
  const lostLabel = ({lostIds}) => lostIds.map(id=>getNode(id).name).join(", ");
  const sections = [];
  if (deleted.length){
    sections.push({items: deleted.map(evLabel)});
  }
  if (modified.length){
    sections.push({
      text: deleted.length
        ? "Außerdem sind folgende Events betroffen — sie bleiben erhalten, verlieren aber ein Ziel:"
        : "",
      items: modified.map(m=>evLabel(m) + " (Ziel „" + lostLabel(m) + "“ wird entfernt)")
    });
  }
  const message = deleted.length
    ? subject + " wird von Events verwendet. Beim Löschen " + what + " werden diese Events gelöscht:"
    : subject + " wird von Events verwendet. Folgende Events bleiben erhalten, verlieren beim Löschen " + what + " aber ein Ziel:";
  showConfirm(message, doDelete, {yesLabel:"OK", sections});
}

function deleteConnection(conn){
  const remaining = state.connections.filter(c=>c.id!==conn.id);
  const losses = eventsLosingTargets(remaining);
  confirmEventLosses(losses, "Diese Verbindung", "der Verbindung", ()=>{
    state.connections = remaining;
    applyEventLosses(losses);
    deselectAll();
  });
}

function deleteNode(node){
  const remaining = state.connections.filter(c=>c.from!==node.id && c.to!==node.id);
  const losses = eventsLosingTargets(remaining, node.id);
  confirmEventLosses(losses, "Dieses Element", "des Elements", ()=>{
    state.nodes = state.nodes.filter(n=>n.id!==node.id);
    state.connections = remaining;
    applyEventLosses(losses);
    deselectAll();
  });
}

/* Ziele, die einem Event zur Auswahl stehen:
   1) alle abgehenden Verbindungen des Elements (Request/Event-Richtung)
   2) zusätzlich alle eingehenden REST-Verbindungen (inkl. WebSocket) — REST ist
      Request/Response, daher kann eine Antwort auch über den Rückweg einer
      eingehenden Anfrage verschickt werden. */
function eventTargetOptions(node){
  const seen = new Set();
  const list = [];
  state.connections.forEach(c=>{
    if (c.from === node.id && !seen.has(c.to)){
      const t = getNode(c.to);
      if (t){ seen.add(c.to); list.push({node:t, response:false}); }
    }
  });
  state.connections.forEach(c=>{
    if (c.to === node.id && c.type === "rest" && !seen.has(c.from)){
      const t = getNode(c.from);
      if (t){ seen.add(c.from); list.push({node:t, response:true}); }
    }
  });
  return list;
}

/* Sucht die Verbindung, entlang der ein Event zwischen zwei Elementen animiert werden
   kann — bevorzugt die direkte abgehende Verbindung; falls es nur eine eingehende
   REST- oder Datenbank-Verbindung vom Ziel gibt, wird diese als Antwortweg genutzt
   (Animation dann in umgekehrter Pfeilrichtung). */
function findConnectionForTravel(fromId, toId, connections){
  connections = connections || state.connections;
  const direct = connections.find(c=>c.from===fromId && c.to===toId);
  if (direct) return {conn:direct, reversed:false};
  const response = connections.find(c=>c.from===toId && c.to===fromId && (c.type==="rest" || c.type==="db"));
  if (response) return {conn:response, reversed:true};
  return null;
}

/* ---------------- Zyklus-Erkennung (unabhängig von der Simulation) ----------------
   Bildet den Ablauf der Simulation statisch als Graph nach: ein Zustand ist
   "Event E feuert an Element N". Er führt zu jedem Event E' eines Ziels T, dessen
   Trigger dem Namen von E entspricht — sofern es wie in fireEvent einen Weg zu T gibt.
   Datenbank-Events antworten an ihren Absender, daher gehört dieser bei ihnen zum Zustand. */
let currentCycles = [];

function buildEventGraph(){
  const states = new Map();
  const edges = new Map();
  const queue = [];
  function addState(node, ev, senderId){
    const key = node.id + "|" + ev.id + (node.type === "database" ? "|" + (senderId || "") : "");
    if (!states.has(key)){
      states.set(key, {key, node, ev, senderId});
      queue.push(key);
    }
    return key;
  }
  state.nodes.forEach(n=>{
    if (n.type !== "database") (n.events||[]).forEach(ev=>addState(n, ev, null));
  });
  while (queue.length){
    const key = queue.shift();
    const {node, ev, senderId} = states.get(key);
    const targetIds = node.type === "database" ? (senderId ? [senderId] : []) : (ev.targetIds || []);
    const label = ev.name || "(Event)";
    const out = [];
    targetIds.forEach(targetId=>{
      const target = getNode(targetId);
      if (!target || !findConnectionForTravel(node.id, targetId)) return;
      (target.events||[]).forEach(next=>{
        if (next.trigger === label) out.push(addState(target, next, node.id));
      });
    });
    edges.set(key, out);
  }
  return {states, edges};
}

/* Stark zusammenhängende Komponenten (Tarjan); jede mit mehr als einem Zustand
   oder einer Selbstschleife ist ein Zyklus. */
function detectCycles(){
  const {states, edges} = buildEventGraph();
  const index = new Map(), low = new Map(), onStack = new Set(), stack = [];
  const cycles = [];
  let counter = 0;
  function strongConnect(v){
    index.set(v, counter); low.set(v, counter); counter++;
    stack.push(v); onStack.add(v);
    for (const w of edges.get(v)){
      if (!index.has(w)){ strongConnect(w); low.set(v, Math.min(low.get(v), low.get(w))); }
      else if (onStack.has(w)) low.set(v, Math.min(low.get(v), index.get(w)));
    }
    if (low.get(v) === index.get(v)){
      const comp = new Set();
      let w;
      do { w = stack.pop(); onStack.delete(w); comp.add(w); } while (w !== v);
      if (comp.size > 1 || edges.get(v).includes(v)){
        const nodeIds = new Set([...comp].map(k=>states.get(k).node.id));
        cycles.push({keys:comp, nodeIds, states, edges});
      }
    }
  }
  for (const key of states.keys()){
    if (!index.has(key)) strongConnect(key);
  }
  return cycles;
}

/* Kürzester Umlauf innerhalb eines Zyklus, der beim ersten Event des Elements beginnt.
   Liefert die Schritte als [{from, to}] mit Zuständen. */
function cyclePathFrom(cycle, nodeId){
  const start = [...cycle.keys].find(k=>cycle.states.get(k).node.id === nodeId);
  const prev = new Map();
  const queue = [start];
  const seen = new Set([start]);
  while (queue.length){
    const u = queue.shift();
    for (const v of cycle.edges.get(u)){
      if (!cycle.keys.has(v)) continue;
      if (v === start){
        const path = [{from:cycle.states.get(u), to:cycle.states.get(v)}];
        let cur = u;
        while (cur !== start){
          const p = prev.get(cur);
          path.unshift({from:cycle.states.get(p), to:cycle.states.get(cur)});
          cur = p;
        }
        return path;
      }
      if (!seen.has(v)){ seen.add(v); prev.set(v, u); queue.push(v); }
    }
  }
  return [];
}

const cycleTooltipEl = document.getElementById("cycle-tooltip");
const CYCLE_MAX_STEPS = 10;

function showCycleTooltip(node, markerEl){
  hideTooltip();

  cycleTooltipEl.innerHTML = "";
  cycles.forEach(cycle=>{
    const h = document.createElement("h5");
    h.textContent = "⚠ Zyklus erkannt";
    cycleTooltipEl.appendChild(h);
    const path = cyclePathFrom(cycle, node.id);
    const ol = document.createElement("ol");
    path.slice(0, CYCLE_MAX_STEPS).forEach(step=>{

      const evName = document.createElement("span");

}

/* Vorschlagsliste für Trigger-Namen: alle Event-Namen, die irgendwo im Diagramm definiert sind. */
function collectTriggerSuggestions(){
  const names = new Set();
  state.nodes.forEach(n=>{
    (n.events||[]).forEach(e=>{
      if (e.name && e.name.trim()) names.add(e.name.trim());
    });
  });
  return Array.from(names).sort((a,b)=>a.localeCompare(b, "de"));
}

/* Startet ein Event manuell per Button — funktioniert unabhängig vom hinterlegten
   Trigger. (Datenbank-Events haben keinen Start-Button, da ihr Ziel immer der
   Absender einer eingehenden Anfrage ist und ohne diese nicht bestimmbar wäre.) */
function startEventManually(node, event){
  simActive = true;
  fireEvent(node, event, null);
}

/* Lässt ein Event von "node" aus zu seinen Zielen "losfliegen". Bei Datenbank-Events
   ist das Ziel immer der übergebene Absender (senderId) — Datenbanken können nur
   antworten, ein eigenes Ziel ist bei ihnen nicht wählbar. */
function fireEvent(node, event, senderId){
  simActive = true;
  let targetIds;
  if (node.type === "database"){
    if (!senderId){
      toast('Event "' + (event.name||"?") + '" kann nur automatisch als Antwort ausgelöst werden.');
      return;
    }
    targetIds = [senderId];
  } else {
    targetIds = event.targetIds || [];
  }
  if (!targetIds.length){
    toast('Event "' + (event.name||"?") + '" hat keine Ziele ausgewählt.');
    return;
  }
  targetIds.forEach(targetId=>{
    const hop = findConnectionForTravel(node.id, targetId);
    const targetNode = getNode(targetId);
    if (!hop || !targetNode) return;
    travelEvent(hop.conn, hop.reversed, event.name || "(Event)", targetNode, node.id);
  });
}

/* Animiert den Event-Namen als fliegendes Label entlang der Verbindung (eigenes,
   framebasiertes Tweening statt SMIL/animateMotion — dessen Zeitachse hängt am
   Dokument-Ladezeitpunkt und lässt dynamisch eingefügte Animationen in manchen
   Browsern sofort am Endzustand "einfrieren" statt zu animieren). Löst am Ziel
   passende Events aus, sobald die Animation ankommt. */
function travelEvent(conn, reversed, label, targetNode, senderId){
  const ep = connEndpoints(conn);
  if (!ep) return;
  let {p1,p2} = ep;
  if (reversed){ const tmp = p1; p1 = p2; p2 = tmp; }
  const dur = 1300; // ms

  const w = Math.max(34, label.length*6.4 + 16);
  const grp = svgEl("g", {class:"sim-event", transform:`translate(${p1.x},${p1.y})`});
  const bg = svgEl("rect", {x:-w/2, y:-11, width:w, height:22, rx:11, class:"sim-event-bg"});
  const txt = svgEl("text", {x:0, y:4, "text-anchor":"middle", class:"sim-event-text"});
  txt.textContent = label;
  grp.appendChild(bg);
  grp.appendChild(txt);
  simLayer.appendChild(grp);

  const startTs = performance.now();
  function step(now){
    if (!simActive || !grp.isConnected){ if (grp.isConnected) grp.remove(); return; }
    const t = Math.min(1, (now - startTs) / dur);
    const x = p1.x + (p2.x - p1.x) * t;
    const y = p1.y + (p2.y - p1.y) * t;
    grp.setAttribute("transform", `translate(${x},${y})`);
    if (t < 1){
      const id = requestAnimationFrame(step);
      simRafIds.push(id);
    } else {
      grp.remove();
      if (simActive) triggerNode(targetNode, label, senderId);
    }
  }
  const id = requestAnimationFrame(step);
  simRafIds.push(id);
}

/* Am Zielelement ankommendes Event: alle Events, deren Trigger exakt dem Event-Namen
   entspricht, werden ebenfalls gestartet. senderId wird durchgereicht, damit
   Datenbank-Events wissen, an wen sie antworten sollen. Läuft weiter, bis nichts
   mehr getriggert wird. */
function triggerNode(node, eventName, senderId){
  if (!Array.isArray(node.events)) return;
  const matches = node.events.filter(e => e.trigger === eventName);
  matches.forEach(e=>{ if (simActive) fireEvent(node, e, senderId); });
}

function renderEventsSection(node, content){

  addBtn.addEventListener("click", ()=>{

    node.events.push({id:uid("ev"), name:"Neues Event", trigger:defaultTrigger, targetIds:[]});
    refresh();

    : node.type === "database"
      ? "Datenbank-Events lösen automatisch aus, sobald ein passendes Trigger-Event eintrifft, und antworten dann direkt an dessen Absender — ein eigenes Ziel ist bei Datenbanken nicht wählbar."
      : "Trigger „Nur Button“ = ausschließlich manueller Start. Andernfalls startet das Event automatisch, sobald am Element ein Event mit exakt diesem Namen eintrifft.";
  content.appendChild(hint);
}

/* Benennt alle Trigger von oldName auf newName um. Tragen noch andere Events den alten
   Namen, bleiben die Trigger unverändert — sie hören dann weiterhin auf diese Events.
   Liefert die Elemente, deren Events geändert wurden. */
function renameTriggers(renamedEv, oldName, newName){
  if (!oldName || oldName === newName) return [];
  const stillUsed = state.nodes.some(n=>(n.events||[]).some(e=>e !== renamedEv && e.name === oldName));
  const triggering = state.nodes.flatMap(n=>(n.events||[]).filter(e=>e.trigger === oldName).map(e=>({n, e})));
  if (!triggering.length) return [];
  if (stillUsed){
    toast("Trigger auf „" + oldName + "“ wurden nicht umbenannt, da noch andere Events so heißen.", 4000);
    return [];
  }
  triggering.forEach(({e})=>{ e.trigger = newName; });
  toast(triggering.length === 1
    ? "1 Trigger wurde auf „" + newName + "“ umbenannt."
    : triggering.length + " Trigger wurden auf „" + newName + "“ umbenannt.");
  return [...new Set(triggering.map(({n})=>n))];
}

function buildEventRow(node, ev, onChange){
  const card = document.createElement("div");
  card.className = "event-card";

  const nameInput = document.createElement("input");
  nameInput.type = "text"; nameInput.className = "event-name-input";
  nameInput.value = ev.name; nameInput.placeholder = "Event-Name";
  nameInput.addEventListener("input", ()=>{ ev.name = nameInput.value; render(); });
  // Erst beim Abschluss der Eingabe (Enter / Feld verlassen): Leerzeichen am Rand entfernen
  // und Trigger, die auf den bisherigen Namen hören, mit umbenennen. Pro Tastendruck
  // umzubenennen würde Trigger mit gleichnamigen Zwischenständen vermischen.
  let nameBeforeEdit = ev.name;
  nameInput.addEventListener("focus", ()=>{ nameBeforeEdit = ev.name; });
  nameInput.addEventListener("change", ()=>{
    const newName = nameInput.value.trim();
    if (!newName){
      ev.name = nameInput.value = nameBeforeEdit;
      toast("Der Event-Name darf nicht leer sein.");
      render();
      return;
    }
    ev.name = nameInput.value = newName;
    const touchedNodes = renameTriggers(ev, nameBeforeEdit, newName);
    nameBeforeEdit = newName;
    render();
    // Trigger-Auswahl der Event-Karten dieses Elements aktualisieren, falls betroffen
    if (touchedNodes.includes(node)) onChange();
  });
  nameInput.addEventListener("keydown", e=>{
    if (e.key === "Enter"){ e.preventDefault(); nameInput.blur(); }
  });
  card.appendChild(nameInput);

  if (node.type === "frontend"){
    ev.trigger = "__button__";
    const hint = document.createElement("div");
    hint.className = "hint"; hint.style.marginTop = "6px";
    hint.textContent = "Trigger: nur Button (manuell)";
    card.appendChild(hint);
  } else {
    const isDb = node.type === "database";
    const trigLbl = document.createElement("div");
    trigLbl.className = "hint"; trigLbl.style.marginTop = "8px";
    trigLbl.textContent = "Trigger:";
    card.appendChild(trigLbl);

    const sel = document.createElement("select");
    sel.className = "event-trigger-select";

    const newWrap = document.createElement("div");
    newWrap.style.display = "none";
    newWrap.style.marginTop = "6px";
    const newInput = document.createElement("input");
    newInput.type = "text"; newInput.className = "event-newtrigger-input";
    newInput.placeholder = "Neuer Trigger-Name …";
    newWrap.appendChild(newInput);

    function populateSelect(){
      sel.innerHTML = "";
      if (isDb){
        if (!ev.trigger || ev.trigger === "__button__"){
          const optNone = document.createElement("option");
          optNone.value = ""; optNone.textContent = "— Trigger wählen —";
          sel.appendChild(optNone);
        }
      } else {
        const optBtn = document.createElement("option");
        optBtn.value = "__button__"; optBtn.textContent = "Nur Button (manuell)";
        sel.appendChild(optBtn);
      }
      const suggestions = collectTriggerSuggestions();
      suggestions.forEach(name=>{
        const o = document.createElement("option");
        o.value = name; o.textContent = name;
        sel.appendChild(o);
      });
      if (ev.trigger && ev.trigger !== "__button__" && !suggestions.includes(ev.trigger)){
        const o = document.createElement("option");
        o.value = ev.trigger; o.textContent = ev.trigger;
        sel.appendChild(o);
      }
      const optNew = document.createElement("option");
      optNew.value = "__new__"; optNew.textContent = "+ Neuer Trigger …";
      sel.appendChild(optNew);
      sel.value = ev.trigger && ev.trigger !== "__button__" ? ev.trigger : (isDb ? "" : "__button__");
    }
    populateSelect();

    sel.addEventListener("change", ()=>{
      if (sel.value === "__new__"){
        newWrap.style.display = "block";
        newInput.value = "";
        newInput.focus();
      } else {
        newWrap.style.display = "none";
        ev.trigger = sel.value;
        render();
      }
    });
    function commitNewTrigger(){
      const v = newInput.value.trim();
      if (v){
        ev.trigger = v;
        newWrap.style.display = "none";
        populateSelect();
        render();
      } else {
        newWrap.style.display = "none";
        sel.value = ev.trigger && ev.trigger !== "__button__" ? ev.trigger : (isDb ? "" : "__button__");
      }
    }
    newInput.addEventListener("keydown", e=>{
      if (e.key === "Enter"){ e.preventDefault(); commitNewTrigger(); }
    });
    newInput.addEventListener("blur", commitNewTrigger);

    card.appendChild(sel);
    card.appendChild(newWrap);
  }

  if (node.type === "database"){
    const tgtHint = document.createElement("div");
    tgtHint.className = "hint"; tgtHint.style.marginTop = "10px";
    tgtHint.textContent = "Ziel: automatisch der Absender der eingehenden Anfrage (Antwort). Keine eigene Auswahl nötig.";
    card.appendChild(tgtHint);
  } else {
    const tgtLbl = document.createElement("div");
    tgtLbl.className = "hint"; tgtLbl.style.marginTop = "10px";
    tgtLbl.textContent = "Ziele (abgehende Verbindungen + Antwortweg eingehender REST-Anfragen):";
    card.appendChild(tgtLbl);

    const options = eventTargetOptions(node);
    if (!options.length){
      const none = document.createElement("div");
      none.className = "hint";
      none.textContent = "Keine verfügbaren Ziele vorhanden.";
      card.appendChild(none);
    } else {
      ev.targetIds = (ev.targetIds||[]).filter(id=>options.some(o=>o.node.id===id));
      card.appendChild(buildTargetDropdown(node, ev, options));
    }
  }

  const btnRow = document.createElement("div");
  btnRow.className = "event-btnrow";
  if (node.type !== "database"){
    const startBtn = document.createElement("button");
    startBtn.className = "tbtn ev-start"; startBtn.textContent = "▶ Start";
    startBtn.addEventListener("click", ()=> startEventManually(node, ev));
    btnRow.appendChild(startBtn);
  }
  const delBtn = document.createElement("button");
  delBtn.className = "tbtn ev-del"; delBtn.textContent = "🗑";
  delBtn.addEventListener("click", ()=>{
    node.events = (node.events||[]).filter(e=>e.id!==ev.id);
    onChange();
    render();
  });
  btnRow.appendChild(delBtn);
  card.appendChild(btnRow);

  return card;
}

/* Kompaktes Mehrfachauswahl-Dropdown für die Event-Ziele. Beim Hovern über einen
   Eintrag glühen das Zielelement und die zugehörige Verbindung im Diagramm auf,
   damit sofort erkennbar ist, welches Element gemeint ist. */
function buildTargetDropdown(node, ev, options){
  const wrap = document.createElement("div");
  wrap.className = "target-dropdown";

  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "target-dropdown-btn";
  wrap.appendChild(btn);

  const panel = document.createElement("div");
  panel.className = "target-dropdown-panel";
  panel.style.display = "none";
  wrap.appendChild(panel);

  function updateButtonLabel(){
    const chosen = options.filter(o => (ev.targetIds||[]).includes(o.node.id));
    if (!chosen.length) btn.textContent = "Ziele wählen …";
    else if (chosen.length === 1) btn.textContent = chosen[0].node.name;
    else btn.textContent = chosen.length + " Ziele ausgewählt";
  }
  updateButtonLabel();

  function onOutsideClick(e){
    if (!wrap.contains(e.target)) closePanel();
  }
  function closePanel(){
    panel.style.display = "none";
    document.removeEventListener("mousedown", onOutsideClick);
  }
  btn.addEventListener("click", e=>{
    e.stopPropagation();
    const wasOpen = panel.style.display !== "none";
    closeOpenTargetDropdown();
    if (!wasOpen){
      panel.style.display = "block";
      document.addEventListener("mousedown", onOutsideClick);
      openTargetDropdownCloser = closePanel;
    }
  });

  options.forEach(opt=>{
    const t = opt.node;
    const row = document.createElement("label");
    row.className = "target-dd-row";
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = (ev.targetIds||[]).includes(t.id);
    cb.addEventListener("change", ()=>{
      ev.targetIds = ev.targetIds || [];
      if (cb.checked){
        if (!ev.targetIds.includes(t.id)) ev.targetIds.push(t.id);
      } else {
        ev.targetIds = ev.targetIds.filter(id=>id!==t.id);
      }
      updateButtonLabel();
      render();
      glow(true); // render() baut das Diagramm neu auf — Hover-Glühen wiederherstellen
    });
    row.appendChild(cb);
    const span = document.createElement("span");
    span.textContent = t.name + (opt.response ? " (Antwort ← REST)" : "");
    row.appendChild(span);
    function glow(on){
      setNodeGlow(t.id, on);
      const hop = findConnectionForTravel(node.id, t.id);
      if (hop) setConnGlow(hop.conn.id, on);
    }
    row.addEventListener("mouseenter", ()=>glow(true));
    row.addEventListener("mouseleave", ()=>glow(false));
    panel.appendChild(row);
  });

  return wrap;
}

/* ============================================================
   TOOLBAR ACTIONS
   ============================================================ */
function addNode(type){
  const center = screenToWorld(window.innerWidth/2, window.innerHeight/2);
  const jitter = () => (Math.random()-0.5)*80;
  const namePrefix = type==="service" ? "Neuer Service" : type==="frontend" ? "Neues Frontend" : "Neue Datenbank";
  const count = state.nodes.filter(n=>n.type===type).length + 1;
  const node = {
    id: uid("n"), type,
    name: namePrefix + " " + count,
    x: center.x + jitter(), y: center.y + jitter(),
    offersRest: type==="service",
    description: "",
    events: []
  };
  state.nodes.push(node);
  render();
  selectNode(node.id);
}

document.getElementById("btn-add-service").addEventListener("click", ()=>addNode("service"));
document.getElementById("btn-add-frontend").addEventListener("click", ()=>addNode("frontend"));
document.getElementById("btn-add-db").addEventListener("click", ()=>addNode("database"));

  const a = document.createElement("a");

/* Prüft eine Import-Datei vollständig, bevor irgendetwas am aktuellen Diagramm
   verändert wird. Liefert eine Liste lesbarer Fehlermeldungen (leer = Datei ist sauber). */
function validateImport(data){
  const errors = [];
  const isObj = v => v !== null && typeof v === "object" && !Array.isArray(v);
  const isNonEmptyStr = v => typeof v === "string" && v.trim() !== "";
  const isNum = v => typeof v === "number" && Number.isFinite(v);
  const optType = (obj, key, type, where) => {
    if (obj[key] !== undefined && typeof obj[key] !== type){
      errors.push(where + ": „" + key + "“ muss vom Typ " + type + " sein.");
    }
  };

  if (!isObj(data)){
    errors.push("Die Datei muss ein JSON-Objekt mit „nodes“ und „connections“ enthalten.");
    return errors;
  }
  if (!Array.isArray(data.nodes)) errors.push("„nodes“ fehlt oder ist keine Liste.");
  if (!Array.isArray(data.connections)) errors.push("„connections“ fehlt oder ist keine Liste.");
  if (errors.length) return errors;

  const nodeIds = new Set();
  const nodesById = new Map();
  const eventIds = new Set();
  const nodeTypes = Object.keys(TYPE_META);
  data.nodes.forEach((n, i)=>{
    let where = "Element " + (i+1);
    if (!isObj(n)){ errors.push(where + ": ist kein Objekt."); return; }
    if (isNonEmptyStr(n.name)) where += " („" + n.name + "“)";

    if (!isNonEmptyStr(n.id)) errors.push(where + ": „id“ fehlt oder ist leer.");
    else if (nodeIds.has(n.id)) errors.push(where + ": ID „" + n.id + "“ ist mehrfach vergeben.");
    else { nodeIds.add(n.id); nodesById.set(n.id, n); }

    if (!nodeTypes.includes(n.type)){
      errors.push(where + ": unbekannter Typ „" + n.type + "“ (erlaubt: " + nodeTypes.join(", ") + ").");
    }
    if (typeof n.name !== "string") errors.push(where + ": „name“ fehlt oder ist kein Text.");
    if (!isNum(n.x) || !isNum(n.y)) errors.push(where + ": Position „x“/„y“ fehlt oder ist keine Zahl.");
    optType(n, "description", "string", where);
    optType(n, "offersRest", "boolean", where);

    if (n.events !== undefined && !Array.isArray(n.events)){
      errors.push(where + ": „events“ ist keine Liste.");
    }
  });

  // Events erst nach allen Elementen prüfen, damit Ziel-IDs auf beliebige Elemente verweisen dürfen.
  data.nodes.forEach((n, i)=>{
    if (!isObj(n) || !Array.isArray(n.events)) return;
    const nodeWhere = "Element " + (i+1) + (isNonEmptyStr(n.name) ? " („" + n.name + "“)" : "");
    n.events.forEach((ev, j)=>{
      const where = nodeWhere + ", Event " + (j+1);
      if (!isObj(ev)){ errors.push(where + ": ist kein Objekt."); return; }
      if (!isNonEmptyStr(ev.id)) errors.push(where + ": „id“ fehlt oder ist leer.");
      else if (eventIds.has(ev.id)) errors.push(where + ": ID „" + ev.id + "“ ist mehrfach vergeben.");
      else eventIds.add(ev.id);
      if (typeof ev.name !== "string") errors.push(where + ": „name“ fehlt oder ist kein Text.");
      if (typeof ev.trigger !== "string") errors.push(where + ": „trigger“ fehlt oder ist kein Text.");
      if (ev.targetIds !== undefined){
        if (!Array.isArray(ev.targetIds)) errors.push(where + ": „targetIds“ ist keine Liste.");
        else ev.targetIds.forEach(t=>{
          if (!nodeIds.has(t)) errors.push(where + ": Ziel „" + t + "“ existiert nicht.");
        });
      }
    });
  });

  const connIds = new Set();
  const connKeys = new Set();
  const connTypes = Object.keys(CONN_META);
  data.connections.forEach((c, i)=>{
    const where = "Verbindung " + (i+1) + (isObj(c) && isNonEmptyStr(c.id) ? " („" + c.id + "“)" : "");
    if (!isObj(c)){ errors.push(where + ": ist kein Objekt."); return; }
    if (!isNonEmptyStr(c.id)) errors.push(where + ": „id“ fehlt oder ist leer.");
    else if (connIds.has(c.id)) errors.push(where + ": ID ist mehrfach vergeben.");
    else connIds.add(c.id);
    if (!connTypes.includes(c.type)){
      errors.push(where + ": unbekannter Typ „" + c.type + "“ (erlaubt: " + connTypes.join(", ") + ").");
    }
    if (!nodeIds.has(c.from)) errors.push(where + ": Start-Element „" + c.from + "“ existiert nicht.");
    if (!nodeIds.has(c.to)) errors.push(where + ": Ziel-Element „" + c.to + "“ existiert nicht.");
    if (c.from !== undefined && c.from === c.to) errors.push(where + ": verbindet ein Element mit sich selbst.");
    else if (nodesById.has(c.from) && nodesById.has(c.to) && connTypes.includes(c.type)){
      const from = nodesById.get(c.from), to = nodesById.get(c.to);
      // Regeln nur prüfen, wenn beide Elemente einen gültigen Typ haben (sonst gibt es schon einen Fehler)
      if (nodeTypes.includes(from.type) && nodeTypes.includes(to.type)){
        const ruleError = connectionRuleError(from, to, c.type);
        if (ruleError) errors.push(where + ": " + ruleError);
      }
      const connKey = c.type + "|" + c.from + "|" + c.to;
      if (connKeys.has(connKey)) errors.push(where + ": doppelte " + CONN_NAMES[c.type] + "-Verbindung von „" + c.from + "“ nach „" + c.to + "“.");
      connKeys.add(connKey);
    }
    optType(c, "description", "string", where);
    optType(c, "websocket", "boolean", where);
  });

  return errors;
}

/* Ergänzt optionale Felder mit Standardwerten (nur für bereits geprüfte Daten). */
function normalizeImport(data){
  return {
    nodes: data.nodes.map(n=>({
      ...n,
      description: n.description || "",
      offersRest: n.type === "service" && !!n.offersRest,
      events: (n.events || []).map(ev=>({...ev, name: ev.name.trim(), trigger: ev.trigger.trim(), targetIds: ev.targetIds || []}))
    })),
    connections: data.connections.map(c=>({
      ...c,
      description: c.description || "",
      websocket: !!c.websocket
    }))
  };
}

document.getElementById("btn-import").addEventListener("click", ()=>{
  document.getElementById("file-import").click();
});
document.getElementById("file-import").addEventListener("change", e=>{
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const failTitle = "Import fehlgeschlagen";
    const failMsg = "Die Datei „" + file.name + "“ wurde nicht importiert. Das aktuelle Diagramm bleibt unverändert.";
    let data;
    try{
      data = JSON.parse(reader.result);
    } catch(err){
      showErrors(failTitle, failMsg, ["Die Datei ist kein gültiges JSON: " + err.message]);
      return;
    }
    const errors = validateImport(data);
    if (errors.length){
      showErrors(failTitle, failMsg, errors);
      return;
    }
    // Erst nach erfolgreicher Prüfung wird der bestehende Zustand ersetzt.
    stopSimulation();
    state = normalizeImport(data);
    deselectAll();
    toast("Diagramm importiert.");
  };
  reader.readAsText(file);
  e.target.value = "";
});

/* keyboard delete */
window.addEventListener("keydown", e=>{
  if (confirmOverlay.classList.contains("show")) return;
  if ((e.key === "Delete" || e.key === "Backspace") && document.activeElement.tagName !== "INPUT" && document.activeElement.tagName !== "TEXTAREA"){
    if (selectedNodeId){
      const node = getNode(selectedNodeId);
      if (node) deleteNode(node);
    } else if (selectedConnId){
      const conn = state.connections.find(c=>c.id===selectedConnId);
      if (conn) deleteConnection(conn);
    }
  }
});

window.addEventListener("resize", ()=>{ /* keep current view */ });

render();
